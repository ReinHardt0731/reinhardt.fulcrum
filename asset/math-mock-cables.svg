<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="title desc">
  <title id="title">Symmetric cables supporting a load</title>
  <desc id="desc">Two equal cable tensions meet at a load; horizontal force components oppose one another and vertical components support the load.</desc>
  <defs>
    <marker id="force-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#168bd2"/>
    </marker>
    <marker id="weight-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#ed8b35"/>
    </marker>
  </defs>
  <rect width="420" height="270" rx="18" fill="#f5f9fc"/>
  <path d="M92 50 210 168 328 50" fill="none" stroke="#526b7d" stroke-width="5"/>
  <path d="M210 168 122 80M210 168 298 80" fill="none" stroke="#168bd2" stroke-width="5" marker-end="url(#force-arrow)"/>
  <path d="M210 168V236" fill="none" stroke="#ed8b35" stroke-width="5" marker-end="url(#weight-arrow)"/>
  <rect x="186" y="155" width="48" height="30" rx="6" fill="#a4ecff" stroke="#168bd2" stroke-width="2"/>
  <path d="M184 168H150M236 168H270" stroke="#90a5b4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="121" y="111" fill="#17334a" font-family="system-ui,sans-serif" font-size="16">T</text>
  <text x="294" y="111" fill="#17334a" font-family="system-ui,sans-serif" font-size="16">T</text>
  <text x="219" y="224" fill="#a95016" font-family="system-ui,sans-serif" font-size="16">load</text>
  <text x="135" y="155" fill="#526b7d" font-family="system-ui,sans-serif" font-size="14">θ</text>
  <text x="274" y="155" fill="#526b7d" font-family="system-ui,sans-serif" font-size="14">θ</text>
</svg>
