<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Maximum-area rectangle under y equals 12 minus x squared</title>
  <desc id="desc">A rectangle from x equals negative 2 to positive 2 and from the x-axis to y equals 8, beneath the parabola.</desc>
  <defs><style>.axis{stroke:#8093ad;stroke-width:2}.curve{fill:none;stroke:#63c9ff;stroke-width:4}.shape{fill:#38d6a3;fill-opacity:.2;stroke:#56e3b5;stroke-width:3}.guide{stroke:#91a7c4;stroke-width:2;stroke-dasharray:6 6}.label{fill:#e7eefb;font:20px system-ui,sans-serif}.accent{fill:#7cebc7;font:600 20px system-ui,sans-serif}</style></defs>
  <path class="axis" d="M70 300H575M320 40V310"/><path class="curve" d="M95 300Q320 -15 545 300"/>
  <path class="shape" d="M190 300V195H450V300Z"/><path class="guide" d="M190 195H450M190 300V322M450 300V322"/>
  <text class="label" x="480" y="295">x-axis</text><text class="accent" x="455" y="220">y = 12 - x^2</text>
  <text class="accent" x="290" y="185">height 8</text><text class="accent" x="293" y="344">width 4</text>
  <text class="label" x="166" y="329">-2</text><text class="label" x="454" y="329">2</text>
</svg>
