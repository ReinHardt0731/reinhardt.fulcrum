<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-labelledby="title desc">
  <title id="title">Right-angle vector addition</title>
  <desc id="desc">A horizontal component of three units and a vertical component of four units form a resultant of five units.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#168bd2"/>
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#ed8b35"/>
    </marker>
  </defs>
  <rect width="420" height="250" rx="18" fill="#f5f9fc"/>
  <path d="M74 190H326V48" fill="none" stroke="#88a0b2" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M74 190H326" fill="none" stroke="#168bd2" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M326 190V48" fill="none" stroke="#168bd2" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M74 190 326 48" fill="none" stroke="#ed8b35" stroke-width="7" marker-end="url(#arrow-accent)"/>
  <path d="M309 190V173H326" fill="none" stroke="#526b7d" stroke-width="2"/>
  <text x="178" y="220" fill="#17334a" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">east component</text>
  <text x="346" y="123" fill="#17334a" font-family="system-ui,sans-serif" font-size="16">north</text>
  <text x="225" y="96" fill="#a95016" font-family="system-ui,sans-serif" font-size="17" transform="rotate(-29 225 96)">resultant</text>
  <text x="200" y="178" fill="#17334a" font-family="system-ui,sans-serif" font-size="16">3k</text>
  <text x="335" y="74" fill="#17334a" font-family="system-ui,sans-serif" font-size="16">4k</text>
  <text x="164" y="102" fill="#a95016" font-family="system-ui,sans-serif" font-size="16">5k</text>
</svg>
